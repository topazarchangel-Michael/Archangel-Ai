name: keep-awake

# Pings the free Render backend so it doesn't sleep after 15 min idle.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://archangel-backend.onrender.com/health
